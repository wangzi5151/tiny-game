<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高阶益智游戏合集</title>
    <style>
        :root {
            --primary: #6c5ce7;
            --primary-light: #a29bfe;
            --success: #00b894;
            --danger: #e17055;
            --warning: #fdcb6e;
            --info: #74b9ff;
            --dark: #2d3436;
            --bg1: #2c3e50;
            --bg2: #4a69bd;
            --card-bg: rgba(255,255,255,0.12);
            --card-hover: rgba(255,255,255,0.22);
            --text: #ffffff;
            --text-dim: rgba(255,255,255,0.7);
            --radius: 14px;
            --shadow: 0 6px 20px rgba(0,0,0,0.25);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, var(--bg1), var(--bg2));
            min-height: 100vh;
            padding: 16px;
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .container { max-width: 900px; margin: 0 auto; }
        h1 {
            text-align: center;
            font-size: clamp(1.6rem, 5vw, 2.4rem);
            margin: 16px 0 8px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .subtitle {
            text-align: center;
            margin-bottom: 28px;
            opacity: 0.75;
            font-size: 0.95rem;
        }
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 14px;
            margin-bottom: 30px;
        }
        .game-card {
            background: var(--card-bg);
            backdrop-filter: blur(8px);
            border-radius: var(--radius);
            padding: 20px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s ease;
            border: 1px solid rgba(255,255,255,0.15);
        }
        .game-card:hover, .game-card:active {
            transform: translateY(-4px) scale(1.02);
            box-shadow: var(--shadow);
            background: var(--card-hover);
        }
        .game-card .icon { font-size: 2.2rem; margin-bottom: 8px; }
        .game-card .name { font-size: 0.9rem; font-weight: 600; }
        .game-card .desc { font-size: 0.72rem; opacity: 0.6; margin-top: 3px; }

        .game-panel {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 24px 20px;
            min-height: 500px;
            display: none;
            border: 1px solid rgba(255,255,255,0.15);
        }
        .game-panel.active { display: block; animation: fadeIn 0.35s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

        .back-btn {
            padding: 8px 18px;
            background: var(--danger);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            margin-bottom: 20px;
            transition: 0.2s;
        }
        .back-btn:hover { opacity: 0.85; }

        .gc { text-align: center; }
        .gc h2 { font-size: 1.6rem; margin-bottom: 12px; color: var(--warning); }
        .rule { font-size: 0.9rem; margin-bottom: 16px; line-height: 1.5; opacity: 0.85; }
        .btn {
            padding: 10px 20px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.2s;
            display: inline-block;
        }
        .btn:hover { transform: scale(1.04); box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .btn:active { transform: scale(0.97); }
        .btn-blue { background: var(--info); color: var(--dark); }
        .btn-green { background: var(--success); color: #fff; }
        .btn-yellow { background: var(--warning); color: var(--dark); }
        .btn-red { background: var(--danger); color: #fff; }
        .btn-purple { background: var(--primary); color: #fff; }
        .big-text { font-size: clamp(2rem, 8vw, 3.5rem); font-weight: bold; margin: 18px 0; }
        .tip { font-size: 0.95rem; margin: 12px 0; min-height: 24px; }
        .tip-ok { color: var(--success); }
        .tip-err { color: var(--danger); }
        .tip-info { color: var(--warning); }
        .score-row { font-size: 0.9rem; margin: 8px 0; opacity: 0.8; }
        .score-row span { font-weight: bold; color: var(--warning); }

        .input {
            padding: 10px 14px;
            font-size: 1rem;
            border-radius: 8px;
            border: 2px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.1);
            color: #fff;
            width: 200px;
            margin: 8px 0;
            outline: none;
            transition: border 0.2s;
        }
        .input:focus { border-color: var(--primary-light); }
        .input::placeholder { color: rgba(255,255,255,0.4); }

        .card-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin: 18px 0;
        }
        .mem-card {
            width: 60px;
            height: 60px;
            background: var(--primary);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            cursor: pointer;
            transition: all 0.25s;
            color: transparent;
        }
        .mem-card.flipped { background: rgba(255,255,255,0.9); color: var(--dark); }
        .mem-card.matched { background: var(--success); color: #fff; pointer-events: none; }

        .color-box {
            width: 140px;
            height: 140px;
            border-radius: var(--radius);
            margin: 16px auto;
            box-shadow: 0 6px 16px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            color: #fff;
            text-shadow: 0 1px 4px rgba(0,0,0,0.4);
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.15);
            border-radius: 3px;
            margin: 12px 0;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: var(--success);
            border-radius: 3px;
            transition: width 0.3s;
        }

        .hp-bar {
            width: 100%;
            max-width: 300px;
            height: 12px;
            background: rgba(255,255,255,0.15);
            border-radius: 6px;
            margin: 6px auto;
            overflow: hidden;
        }
        .hp-fill {
            height: 100%;
            border-radius: 6px;
            transition: width 0.3s;
        }
        .hp-player { background: var(--success); }
        .hp-enemy { background: var(--danger); }

        @media (max-width: 480px) {
            .game-grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
            .game-card { padding: 14px 6px; }
            .game-card .icon { font-size: 1.8rem; }
            .game-panel { padding: 18px 14px; min-height: 400px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 高阶益智游戏合集</h1>
        <p class="subtitle">20款益智 / 对战 / 记忆 / 策略休闲游戏</p>

        <div class="game-grid" id="gameGrid"></div>

        <div class="game-panel" id="gamePanel">
            <button class="back-btn" id="backBtn">← 返回列表</button>
            <div class="gc" id="gc"></div>
        </div>
    </div>

<script>
(function() {
    "use strict";

    var GAMES = [
        { id:1,  icon:"🎯", name:"进阶猜数字", desc:"推理范围猜答案" },
        { id:2,  icon:"🧠", name:"记忆翻牌",   desc:"记住位置配对" },
        { id:3,  icon:"⚔️", name:"石头剪刀布PK", desc:"五局三胜对战" },
        { id:4,  icon:"⚡", name:"反应速度测试", desc:"检测瞬时反应" },
        { id:5,  icon:"🎲", name:"骰子竞猜",   desc:"猜点数大小" },
        { id:6,  icon:"🎰", name:"水果老虎机", desc:"三图相同中奖" },
        { id:7,  icon:"🔤", name:"词语接龙",   desc:"首尾文字相接" },
        { id:8,  icon:"🎨", name:"色彩辨识",   desc:"识别对应颜色" },
        { id:9,  icon:"🗝️", name:"密码破解",   desc:"尝试四位密码" },
        { id:10, icon:"😃", name:"表情记忆",   desc:"记忆表情顺序" },
        { id:11, icon:"✍️", name:"文字默写",   desc:"记忆短句复刻" },
        { id:12, icon:"🧮", name:"限时速算",   desc:"快速口算答题" },
        { id:13, icon:"🪙", name:"硬币博弈",   desc:"竞猜正反面" },
        { id:14, icon:"📊", name:"数字大小挑战", desc:"判断数值大小" },
        { id:15, icon:"🎫", name:"随机抽签",   desc:"抽取随机人选" },
        { id:16, icon:"🏃", name:"手速挑战",   desc:"限时点击比拼" },
        { id:17, icon:"⏱️", name:"精准计时",   desc:"控制时间停止" },
        { id:18, icon:"🏆", name:"综合闯关",   desc:"多关卡连续挑战" },
        { id:19, icon:"👥", name:"队伍分组",   desc:"随机分配小组" },
        { id:20, icon:"🛡️", name:"攻防对战",   desc:"策略选择攻防" }
    ];

    var grid = document.getElementById("gameGrid");
    var panel = document.getElementById("gamePanel");
    var gc = document.getElementById("gc");
    var backBtn = document.getElementById("backBtn");
    var timers = [];

    function addTimer(id) { timers.push(id); return id; }
    function clearAllTimers() { timers.forEach(function(t){ clearTimeout(t); clearInterval(t); }); timers = []; }

    GAMES.forEach(function(g) {
        var card = document.createElement("div");
        card.className = "game-card";
        card.dataset.id = g.id;
        card.innerHTML = '<div class="icon">' + g.icon + '</div><div class="name">' + g.name + '</div><div class="desc">' + g.desc + '</div>';
        card.addEventListener("click", function() { openGame(g.id); });
        grid.appendChild(card);
    });

    backBtn.addEventListener("click", function() {
        clearAllTimers();
        panel.classList.remove("active");
        grid.style.display = "grid";
    });

    function openGame(id) {
        clearAllTimers();
        grid.style.display = "none";
        panel.classList.add("active");
        gc.innerHTML = "";
        var fn = gameFns[id];
        if (fn) fn();
    }

    function tip(cls, txt) {
        var el = document.createElement("p");
        el.className = "tip " + cls;
        el.textContent = txt;
        return el;
    }

    var gameFns = {};

    /* ========== Game 1: 进阶猜数字 ========== */
    gameFns[1] = function() {
        var target = Math.floor(Math.random() * 100) + 1;
        var tries = 0;
        gc.innerHTML = '<h2>🎯 进阶猜数字</h2><p class="rule">系统随机 1~100，根据提示缩小范围</p>';
        var inp = document.createElement("input");
        inp.className = "input";
        inp.type = "number";
        inp.placeholder = "输入数字";
        var btn = document.createElement("button");
        btn.className = "btn btn-green";
        btn.textContent = "提交";
        var t = tip("tip-info", "开始挑战吧");
        var cnt = document.createElement("p");
        cnt.className = "score-row";
        cnt.textContent = "已猜: 0 次";
        gc.appendChild(inp);
        gc.appendChild(btn);
        gc.appendChild(t);
        gc.appendChild(cnt);
        btn.addEventListener("click", function() {
            var v = parseInt(inp.value, 10);
            if (isNaN(v)) { t.className = "tip tip-err"; t.textContent = "请输入数字"; return; }
            tries++;
            cnt.textContent = "已猜: " + tries + " 次";
            if (v === target) {
                t.className = "tip tip-ok";
                t.textContent = "恭喜猜对！用了 " + tries + " 次";
                btn.disabled = true;
            } else if (v > target) {
                t.className = "tip tip-info";
                t.textContent = "偏大，往小猜";
            } else {
                t.className = "tip tip-info";
                t.textContent = "偏小，往大猜";
            }
        });
        inp.addEventListener("keydown", function(e) { if (e.key === "Enter") btn.click(); });
    };

    /* ========== Game 2: 记忆翻牌 ========== */
    gameFns[2] = function() {
        gc.innerHTML = '<h2>🧠 记忆翻牌</h2><p class="rule">翻开卡牌，找出三对相同图案</p>';
        var emojis = ["🐱","🐶","🐰","🦊","🐻","🐼"];
        var pairs = emojis.slice(0, 3);
        var cards = pairs.concat(pairs);
        for (var i = cards.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var tmp = cards[i]; cards[i] = cards[j]; cards[j] = tmp;
        }
        var wrap = document.createElement("div");
        wrap.className = "card-grid";
        var first = null, locked = false, matched = 0, steps = 0;
        cards.forEach(function(ch, idx) {
            var c = document.createElement("div");
            c.className = "mem-card";
            c.dataset.ch = ch;
            c.dataset.idx = idx;
            c.textContent = "?";
            c.addEventListener("click", function() {
                if (locked || this.classList.contains("flipped") || this.classList.contains("matched")) return;
                this.classList.add("flipped");
                this.textContent = ch;
                if (!first) {
                    first = this;
                } else {
                    steps++;
                    locked = true;
                    if (first.dataset.ch === ch && first.dataset.idx !== idx) {
                        first.classList.add("matched");
                        this.classList.add("matched");
                        matched++;
                        locked = false;
                        first = null;
                        if (matched === 3) {
                            gc.appendChild(tip("tip-ok", "全部配对成功！步数: " + steps));
                        }
                    } else {
                        var f = first;
                        var s = this;
                        addTimer(setTimeout(function() {
                            f.classList.remove("flipped");
                            f.textContent = "?";
                            s.classList.remove("flipped");
                            s.textContent = "?";
                            locked = false;
                            first = null;
                        }, 800));
                    }
                }
            });
            wrap.appendChild(c);
        });
        gc.appendChild(wrap);
        var stepText = document.createElement("p");
        stepText.className = "score-row";
        stepText.textContent = "步数: 0";
        gc.appendChild(stepText);
        var origClick = wrap.onclick;
        wrap.addEventListener("click", function() { stepText.textContent = "步数: " + steps; });
    };

    /* ========== Game 3: 石头剪刀布PK ========== */
    gameFns[3] = function() {
        var uW = 0, pW = 0;
        gc.innerHTML = '<h2>⚔️ 石头剪刀布PK</h2><p class="rule">五局三胜</p>';
        var show = document.createElement("div");
        show.className = "big-text";
        show.textContent = "VS";
        var t = tip("tip-info", "请选择招式");
        var sc = document.createElement("p");
        sc.className = "score-row";
        sc.innerHTML = '我方: <span id="uw">0</span> &nbsp; 电脑: <span id="pw">0</span>';
        gc.appendChild(show);
        var names = ["✊ 石头","✌️ 剪刀","🖐️ 布"];
        var vals = [0, 1, 2];
        vals.forEach(function(v) {
            var b = document.createElement("button");
            b.className = "btn " + ["btn-red","btn-yellow","btn-blue"][v];
            b.textContent = names[v];
            b.addEventListener("click", function() {
                if (uW >= 3 || pW >= 3) return;
                var pc = Math.floor(Math.random() * 3);
                show.textContent = names[v] + "  VS  " + names[pc];
                if (v === pc) {
                    t.className = "tip tip-info"; t.textContent = "平局";
                } else if ((v + 1) % 3 === pc) {
                    uW++;
                    t.className = "tip tip-ok"; t.textContent = "你赢了这局！";
                } else {
                    pW++;
                    t.className = "tip tip-err"; t.textContent = "电脑赢了这局";
                }
                document.getElementById("uw").textContent = uW;
                document.getElementById("pw").textContent = pW;
                if (uW >= 3) { t.className = "tip tip-ok"; t.textContent = "🎉 你赢得比赛！"; }
                else if (pW >= 3) { t.className = "tip tip-err"; t.textContent = "电脑赢得比赛"; }
            });
            gc.appendChild(b);
        });
        gc.appendChild(sc);
        gc.appendChild(t);
    };

    /* ========== Game 4: 反应速度测试 ========== */
    gameFns[4] = function() {
        gc.innerHTML = '<h2>⚡ 反应速度测试</h2><p class="rule">色块变绿后立刻点击</p>';
        var box = document.createElement("div");
        box.className = "color-box";
        box.style.background = "#555";
        box.style.cursor = "pointer";
        box.textContent = "准备";
        var btn = document.createElement("button");
        btn.className = "btn btn-green";
        btn.textContent = "开始测试";
        var t = tip("tip-info", "点击开始");
        gc.appendChild(box);
        gc.appendChild(btn);
        gc.appendChild(t);
        var best = Infinity;
        btn.addEventListener("click", function() {
            box.style.background = "#555";
            box.textContent = "等待变色...";
            box.style.cursor = "default";
            t.className = "tip tip-info";
            t.textContent = "等待中...";
            var delay = Math.floor(Math.random() * 3000) + 1500;
            var timerId = addTimer(setTimeout(function() {
                var start = Date.now();
                box.style.background = "#00b894";
                box.textContent = "点我！";
                box.style.cursor = "pointer";
                box.onclick = function() {
                    var time = Date.now() - start;
                    box.textContent = time + " ms";
                    box.style.cursor = "default";
                    box.onclick = null;
                    t.className = "tip " + (time < 300 ? "tip-ok" : time < 500 ? "tip-info" : "tip-err");
                    t.textContent = "反应时间: " + time + "ms" + (time < 300 ? " 🏆 极速!" : time < 500 ? " 不错!" : " 继续努力");
                    if (time < best) { best = time; }
                    gc.appendChild(document.createTextNode(""));
                };
            }, delay));
        });
    };

    /* ========== Game 5: 骰子竞猜 ========== */
    gameFns[5] = function() {
        gc.innerHTML = '<h2>🎲 骰子竞猜</h2><p class="rule">两个骰子，猜总和偏大(>6)或偏小(<7)</p>';
        var show = document.createElement("div");
        show.className = "big-text";
        show.textContent = "🎲🎲";
        var t = tip("tip-info", "做出选择");
        var sc = document.createElement("p");
        sc.className = "score-row";
        var wins = 0, total = 0;
        sc.textContent = "胜率: 0/0";
        gc.appendChild(show);
        var btnB = document.createElement("button");
        btnB.className = "btn btn-blue";
        btnB.textContent = "猜偏大(>6)";
        var btnS = document.createElement("button");
        btnS.className = "btn btn-red";
        btnS.textContent = "猜偏小(<7)";
        function roll(type) {
            var d1 = Math.floor(Math.random() * 6) + 1;
            var d2 = Math.floor(Math.random() * 6) + 1;
            var sum = d1 + d2;
            show.textContent = "🎲" + d1 + " + 🎲" + d2 + " = " + sum;
            total++;
            if ((type === "big" && sum > 6) || (type === "small" && sum < 7)) {
                wins++;
                t.className = "tip tip-ok"; t.textContent = "猜对了！总和: " + sum;
            } else {
                t.className = "tip tip-err"; t.textContent = "猜错了！总和: " + sum;
            }
            sc.textContent = "胜率: " + wins + "/" + total;
        }
        btnB.addEventListener("click", function() { roll("big"); });
        btnS.addEventListener("click", function() { roll("small"); });
        gc.appendChild(btnB);
        gc.appendChild(btnS);
        gc.appendChild(t);
        gc.appendChild(sc);
    };

    /* ========== Game 6: 水果老虎机 ========== */
    gameFns[6] = function() {
        gc.innerHTML = '<h2>🎰 水果老虎机</h2><p class="rule">三个图案相同即中大奖</p>';
        var show = document.createElement("div");
        show.className = "big-text";
        show.textContent = "🍎 🍊 🍌";
        var t = tip("tip-info", "试试手气");
        var sc = document.createElement("p");
        sc.className = "score-row";
        var wins = 0, total = 0;
        sc.textContent = "中奖: 0/0";
        gc.appendChild(show);
        var btn = document.createElement("button");
        btn.className = "btn btn-yellow";
        btn.textContent = "🎰 开始";
        var fruits = ["🍎","🍊","🍌","🍇","🍓","🍉","🍑"];
        btn.addEventListener("click", function() {
            btn.disabled = true;
            var results = [];
            var step = 0;
            var rollTimer = addTimer(setInterval(function() {
                var r = [];
                for (var i = 0; i < 3; i++) r.push(fruits[Math.floor(Math.random() * fruits.length)]);
                show.textContent = r.join(" ");
                step++;
                if (step >= 15) {
                    clearInterval(rollTimer);
                    total++;
                    var a = r[0], b = r[1], c = r[2];
                    if (a === b && b === c) {
                        wins++;
                        t.className = "tip tip-ok"; t.textContent = "🎉 大奖！三个" + a;
                    } else if (a === b || b === c || a === c) {
                        t.className = "tip tip-info"; t.textContent = "小奖，两个相同";
                    } else {
                        t.className = "tip tip-err"; t.textContent = "未中奖";
                    }
                    sc.textContent = "中奖: " + wins + "/" + total;
                    btn.disabled = false;
                }
            }, 100));
        });
        gc.appendChild(btn);
        gc.appendChild(t);
        gc.appendChild(sc);
    };

    /* ========== Game 7: 词语接龙 ========== */
    gameFns[7] = function() {
        var last = "欢乐";
        gc.innerHTML = '<h2>🔤 词语接龙</h2><p class="rule">用上一个词的最后一个字开头接新词</p>';
        var tail = document.createElement("p");
        tail.innerHTML = '当前尾字: <span style="font-size:1.3rem;color:var(--warning)">' + last.slice(-1) + '</span>';

            { q: "10 - 4 = ?", a: "6" },
            { q: "哪个最大？", opts: ["0.5","0.3","0.8","0.1"], a: "0.8" },
            { q: "3 × 4 = ?", a: "12" },
            { q: "太阳从哪个方向升起？", opts: ["东方","西方","南方","北方"], a: "东方" },
            { q: "100 ÷ 5 = ?", a: "20" },
            { q: "哪个是质数？", opts: ["4","6","7","8"], a: "7" },
            { q: "5 + 8 = ?", a: "13" }
        ];
        function nextLevel() {
            if (level >= challenges.length) {
                gc.innerHTML = '<h2>🏆 综合闯关</h2>';
                gc.appendChild(tip("tip-ok", "恭喜通关！总分: " + score + "/" + challenges.length));
                return;
            }
            var ch = challenges[level];
            gc.innerHTML = '<h2>🏆 综合闯关</h2><p class="rule">第 ' + (level + 1) + '/' + challenges.length + ' 关 | 得分: ' + score + '</p>';
            var progress = document.createElement("div");
            progress.className = "progress-bar";
            var fill = document.createElement("div");
            fill.className = "progress-fill";
            fill.style.width = (level / challenges.length * 100) + "%";
            progress.appendChild(fill);
            gc.appendChild(progress);
            var qEl = document.createElement("div");
            qEl.className = "big-text";
            qEl.style.fontSize = "1.5rem";
            qEl.textContent = ch.q;
            gc.appendChild(qEl);
            var t = tip("tip-info", "选择答案");
            if (ch.opts) {
                ch.opts.forEach(function(o) {
                    var b = document.createElement("button");
                    b.className = "btn btn-blue";
                    b.textContent = o;
                    b.addEventListener("click", function() {
                        if (o === ch.a) { score++; t.className = "tip tip-ok"; t.textContent = "✓ 正确！"; }
                        else { t.className = "tip tip-err"; t.textContent = "✗ 答案: " + ch.a; }
                        level++;
                        setTimeout(nextLevel, 1000);
                    });
                    gc.appendChild(b);
                });
            } else {
                var inp = document.createElement("input");
                inp.className = "input";
                inp.type = "number";
                inp.placeholder = "输入答案";
                var btn = document.createElement("button");
                btn.className = "btn btn-green";
                btn.textContent = "提交";
                btn.addEventListener("click", function() {
                    if (inp.value === ch.a) { score++; t.className = "tip tip-ok"; t.textContent = "✓ 正确！"; }
                    else { t.className = "tip tip-err"; t.textContent = "✗ 答案: " + ch.a; }
                    level++;
                    setTimeout(nextLevel, 1000);
                });
                inp.addEventListener("keydown", function(e) { if (e.key === "Enter") btn.click(); });
                gc.appendChild(inp);
                gc.appendChild(btn);
            }
            gc.appendChild(t);
        }
        nextLevel();
    };

    /* ========== Game 19: 队伍分组 ========== */
    gameFns[19] = function() {
        gc.innerHTML = '<h2>👥 队伍分组</h2><p class="rule">输入名单和组数，随机分配</p>';
        var ta = document.createElement("textarea");
        ta.className = "input";
        ta.style.cssText = "width:90%;max-width:400px;height:100px;resize:vertical;";
        ta.placeholder = "每行一个名字";
        ta.value = "张三\n李四\n王五\n赵六\n孙七\n周八\n吴九\n郑十";
        var grpInp = document.createElement("input");
        grpInp.className = "input";
        grpInp.type = "number";
        grpInp.min = "2";
        grpInp.max = "10";
        grpInp.placeholder = "组数";
        grpInp.value = "2";
        var btn = document.createElement("button");
        btn.className = "btn btn-green";
        btn.textContent = "👥 分组";
        var result = document.createElement("div");
        result.style.cssText = "text-align:left;max-width:500px;margin:16px auto;font-size:0.95rem;";
        gc.appendChild(ta);
        gc.appendChild(grpInp);
        gc.appendChild(btn);
        gc.appendChild(result);
        btn.addEventListener("click", function() {
            var names = ta.value.split("\n").map(function(s){ return s.trim(); }).filter(function(s){ return s.length > 0; });
            var g = parseInt(grpInp.value, 10);
            if (names.length < g) { result.innerHTML = '<p class="tip tip-err">人数不够分组</p>'; return; }
            for (var i = names.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var t2 = names[i]; names[i] = names[j]; names[j] = t2;
            }
            var groups = [];
            for (var k = 0; k < g; k++) groups.push([]);
            names.forEach(function(n, idx) { groups[idx % g].push(n); });
            var html = "";
            var colors = ["#e74c3c","#3498db","#2ecc71","#f39c12","#9b59b6","#1abc9c","#e67e22","#34495e","#e84393","#00b894"];
            groups.forEach(function(gr, i) {
                html += '<div style="margin:10px 0;padding:10px;border-left:4px solid ' + colors[i % colors.length] + ';background:rgba(255,255,255,0.08);border-radius:0 8px 8px 0;">';
                html += '<b style="color:' + colors[i % colors.length] + '">第' + (i + 1) + '组</b>: ';
                html += gr.join(", ");
                html += '</div>';
            });
            result.innerHTML = html;
        });
    };

    /* ========== Game 20: 攻防对战 ========== */
    gameFns[20] = function() {
        var pH = 100, eH = 100, pCombo = 0;
        gc.innerHTML = '<h2>🛡️ 攻防对战</h2><p class="rule">选择招式，克制对方！<br>✊克✌️ 克🖐️ 克✊ | 防御减半伤害</p>';
        var show = document.createElement("div");
        show.className = "big-text";
        show.textContent = "⚔️";
        var playerHP = document.createElement("div");
        playerHP.innerHTML = '<div style="font-size:0.85rem;margin-bottom:2px;">🧑 你</div><div class="hp-bar"><div class="hp-fill hp-player" id="php" style="width:100%"></div></div>';
        var enemyHP = document.createElement("div");
        enemyHP.innerHTML = '<div style="font-size:0.85rem;margin-bottom:2px;">👹 对手</div><div class="hp-bar"><div class="hp-fill hp-enemy" id="ehp" style="width:100%"></div></div>';
        var t = tip("tip-info", "选择你的招式");
        var sc = document.createElement("p");
        sc.className = "score-row";
        sc.textContent = "连击: 0";
        gc.appendChild(show);
        gc.appendChild(playerHP);
        gc.appendChild(enemyHP);

        var moves = [
            { name: "✊ 石头", val: 0, cls: "btn-red" },
            { name: "✌️ 剪刀", val: 1, cls: "btn-yellow" },
            { name: "🖐️ 布", val: 2, cls: "btn-blue" },
            { name: "🛡️ 防御", val: -1, cls: "btn-purple" }
        ];

        moves.forEach(function(m) {
            var b = document.createElement("button");
            b.className = "btn " + m.cls;
            b.textContent = m.name;
            b.addEventListener("click", function() {
                if (pH <= 0 || eH <= 0) return;
                var pc = Math.floor(Math.random() * 3);
                var pDmg = 0, eDmg = 0;
                if (m.val === -1) {
                    eDmg = 8;
                    show.textContent = "🛡️防御 → -8";
                } else {
                    if (m.val === pc) {
                        pDmg = 15; eDmg = 15;
                        show.textContent = "⚔️ 平局互伤";
                    } else if ((m.val + 1) % 3 === pc) {
                        pCombo++;
                        eDmg = 20 + pCombo * 2;
                        show.textContent = "💥 你克对手！";
                    } else {
                        pCombo = 0;
                        pDmg = 20;
                        show.textContent = "😣 被克了";
                    }
                }
                pH = Math.max(0, pH - pDmg);
                eH = Math.max(0, eH - eDmg);
                document.getElementById("php").style.width = pH + "%";
                document.getElementById("ehp").style.width = eH + "%";
                sc.textContent = "连击: " + pCombo;

                if (eH <= 0) {
                    t.className = "tip tip-ok"; t.textContent = "🎉 你赢了！";
                } else if (pH <= 0) {
                    t.className = "tip tip-err"; t.textContent = "😢 你输了";
                } else {
                    t.className = "tip tip-info";
                    t.textContent = "你: " + pH + "HP | 对手: " + eH + "HP";
                }
            });
            gc.appendChild(b);
        });
        gc.appendChild(t);
        gc.appendChild(sc);
    };

})();
</script>
</body>
</html>
